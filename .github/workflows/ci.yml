---
name: CI Tests & Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Auto-cancel an in-progress CI run when a newer commit is pushed to the same
# ref, so superseded runs don't pile up (only the latest matters; a cancelled
# run concludes as "cancelled" and never triggers the deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.6'
          bundler: '2.7.2'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --format progress

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # Outer backstop only. The suite itself is bounded inside the container
    # (timeout around rspec) and the network guard turns a stray connect into an
    timeout-minutes: 25
    env:
      CI_COMPOSE: docker compose -f docker/ci/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      # Split into phases with per-step timeouts so a hang is localised by step
      # status alone (no log needed): is it the image build (bundle install
      # reaching rubygems), the database, or the specs?
      - name: Build test image
        timeout-minutes: 12
        run: $CI_COMPOSE build

      # Blocking: a test failure fails this job.
      #
      # Run the container DETACHED and poll its state in a bash loop that is
      # guaranteed to terminate, then read `docker logs` (the daemon captures
      # stdout continuously, independent of attach/pipes - so even a wedged
      # container's output is retrievable). This finally surfaces WHERE it hangs:
      # the phase marker (db setup vs rspec) and, with the documentation
      # formatter, the exact spec on the last line.
      - name: Run test suite
        run: |
          $CI_COMPOSE up -d
          cid=$($CI_COMPOSE ps -q test)
          echo "test container: $cid"
          for i in $(seq 1 144); do
            s=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo gone)
            [ "$s" = "exited" ] && break
            sleep 5
          done
          echo "===== test container logs (tail) ====="
          docker logs "$cid" 2>&1 | tail -100
          rc=$(docker inspect -f '{{.State.ExitCode}}' "$cid" 2>/dev/null || echo 1)
          echo "container status=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null) exit=$rc"
          [ "$rc" = "0" ]

      - name: Tear down
        if: always()
        run: $CI_COMPOSE down -v || true
