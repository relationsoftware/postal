---
openapi: 3.0.3
info:
  title: app
  version: 1.0.0
servers: []
security:
- ServerAPIKey: []
paths:
  "/api/v1/messages/deliveries":
    post:
      summary: deliveries
      tags:
      - ServerAPI::Message
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
            example: {}
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
              required:
              - id
            example:
              id: 1
      responses:
        '200':
          description: returns an array of deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  time:
                    type: number
                    format: float
                  flags:
                    type: object
                    properties: {}
                  data:
                    type: array
                    properties:
                      message:
                        type: string
                      code:
                        type: string
                      token:
                        type: string
                      id:
                        type: integer
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        status:
                          type: string
                        details:
                          type: string
                        output:
                          type: string
                        sent_with_ssl:
                          type: boolean
                        log_id:
                          type: string
                        time:
                          type: number
                          format: float
                        timestamp:
                          type: number
                          format: float
                      required:
                      - id
                      - status
                      - details
                      - output
                      - sent_with_ssl
                      - log_id
                      - time
                      - timestamp
                required:
                - status
                - time
                - flags
                - data
              example:
                status: success
                time: 0.003
                flags: {}
                data:
                - id: 1
                  status: SoftFail
                  details: no server found
                  output: '404'
                  sent_with_ssl: true
                  log_id: '1234'
                  time: 1.2
                  timestamp: 1769642866.6181078
                - id: 2
                  status: Sent
                  details: sent successfully
                  output: '200'
                  sent_with_ssl: false
                  log_id: '5678'
                  time: 2.2
                  timestamp: 1769642866.6893709
      security:
      - ServerAPIKey: []
  "/api/v1/messages/message":
