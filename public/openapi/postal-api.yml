                            type: string
                          message_id:
                            type: string
                          timestamp:
                            type: number
                            format: float
                          direction:
                            type: string
                          size:
                            type: string
                          bounce:
                            type: boolean
                          bounce_for_id:
                            type: integer
                          tag:
                            nullable: true
                          received_with_ssl:
                            nullable: true
                        required:
                        - rcpt_to
                        - mail_from
                        - subject
                        - message_id
                        - timestamp
                        - direction
                        - size
                        - bounce
                        - bounce_for_id
                        - tag
                        - received_with_ssl
                      inspection:
                        type: object
                        properties:
                          inspected:
                            type: boolean
                          spam:
                            type: boolean
                          spam_score:
                            type: number
                            format: float
                          threat:
                            type: boolean
                          threat_details:
                            nullable: true
                        required:
                        - inspected
                        - spam
                        - spam_score
                        - threat
                        - threat_details
                      plain_body:
                        type: string
                      html_body:
                        nullable: true
                      attachments:
                        type: array
                        items:
                          type: object
                          properties:
                            filename:
                              type: string
                            content_type:
                              type: string
                            data:
                              type: string
                            size:
                              type: integer
                            hash:
                              type: string
                          required:
                          - filename
                          - content_type
                          - data
                          - size
                          - hash
                      headers:
                        type: object
                        properties:
                          date:
                            type: array
                            items:
                              type: string
                          from:
                            type: array
                            items:
                              type: string
                          to:
                            type: array
                            items:
                              type: string
                          message-id:
                            type: array
                            items:
                              type: string
                          subject:
                            type: array
                            items:
                              type: string
                          mime-version:
                            type: array
                            items:
                              type: string
                          content-type:
                            type: array
                            items:
                              type: string
                          content-transfer-encoding:
                            type: array
                            items:
                              type: string
                        required:
                        - date
                        - from
                        - to
                        - message-id
                        - subject
                        - mime-version
                        - content-type
                        - content-transfer-encoding
                      raw_message:
                        type: string
                      activity_entries:
                        type: object
                        properties:
                          loads:
                            type: array
                            items:
                              type: object
                              properties:
                                ip_address:
                                  type: string
                                user_agent:
                                  type: string
                                timestamp:
                                  type: string
                              required:
                              - ip_address
                              - user_agent
                              - timestamp
                          clicks:
                            type: array
                            items:
                              type: object
                              properties:
                                url:
                                  type: string
                                ip_address:
                                  type: string
                                user_agent:
                                  type: string
                                timestamp:
                                  type: string
                              required:
                              - url
                              - ip_address
                              - user_agent
                              - timestamp
                        required:
                        - loads
                        - clicks
                required:
                - status
                - time
                - flags
                - data
              example:
                status: success
                time: 0.009
                flags: {}
                data:
                  message: No message found matching provided ID
                  code: MessageNotFound
                  token: 3QnOH1To9rzrLn91
                  id: 1
