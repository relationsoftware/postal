  "/api/v1/send/message":
    post:
      summary: message
      tags:
      - ServerAPI::Send
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: array
                  items:
                    type: string
                from:
                  type: string
                  nullable: true
                subject:
                  type: string
                plain_body:
                  type: string
                  nullable: true
                message_ids:
                  type: object
                  properties:
                    test1@example.com:
                      type: string
                    test2@example.com:
                      type: string
                  required:
                  - test1@example.com
                cc:
                  type: array
                  items:
                    type: string
                bcc:
                  type: array
                  items:
                    type: string
                sender:
                  type: string
                tag:
                  type: string
                reply_to:
                  type: string
                html_body:
                  type: string
                  nullable: true
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        nullable: true
                      content_type:
                        type: string
                      data:
                        type: string
                        nullable: true
                    required:
                    - name
                    - content_type
                    - data
                headers:
                  type: object
                  properties:
                    x-test-header-1:
                      type: string
                    x-test-header-2:
                      type: string
                  required:
                  - x-test-header-1
                  - x-test-header-2
                bounce:
                  type: boolean
              required:
              - to
              - from
              - plain_body
              - subject
            example:
              to:
              - test@example.com
              from: test@example33.com
              subject: Test
              plain_body: plain text
              message_ids:
                test1@example.com: id with spaces@example.com
                test2@example.com: valid-id@example.com
              cc:
              - cc@example.com
              bcc:
              - bcc@example.com
              sender: sender@example33.com
              tag: test-tag
              reply_to: reply@example.com
              html_body: "<p>html</p>"
              attachments:
              - name: test1.txt
                content_type: text/plain
                data: 'aGVsbG8gd29ybGQgMQ==

                  '
              - name: test2.txt
                content_type: text/plain
                data: 'aGVsbG8gd29ybGQgMg==

                  '
              headers:
                x-test-header-1: '111'
                x-test-header-2: '222'
              bounce: false
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
            example: {}
      responses:
        '200':
          description: creates appropriate message objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  time:
                    type: number
                    format: float
                  flags:
                    type: object
                    properties: {}
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      code:
                        type: string
                      token:
                        type: string
                    required:
                    - code
                required:
                - status
                - time
                - flags
                - data
              example:
                status: error
                time: 0.004
                flags: {}
                data:
                  message: The From address is not authorised to send mail from this
                    server
                  code: UnauthenticatedFromAddress
                  token: invalid
      security:
      - ServerAPIKey: []
