                          status:
                            type: string
                          last_delivery_attempt:
                            nullable: true
                          held:
                            type: boolean
                          hold_expiry:
                            nullable: true
                        required:
                        - status
                        - last_delivery_attempt
                        - held
                        - hold_expiry
                      details:
                        type: object
